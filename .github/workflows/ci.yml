name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.6"
      - run: ruff check .
      - run: ruff format --check .

  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest tests/unit -q

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Start Redpanda and ClickHouse
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose up -d --wait redpanda clickhouse
          docker compose run --rm topics-init
      - run: pip install -e ".[dev]"
      - name: Integration tests
        env:
          STREAMPULSE_RUN_INTEGRATION: "1"
          CLICKHOUSE_PASSWORD: change-me-local-only
        run: pytest tests/integration -v
      - name: Containerised demo run
        run: make demo COUNT=3000 RATE=500 IDLE_TIMEOUT=15
      - name: Service logs on failure
        if: failure()
        run: docker compose logs --tail 200 redpanda clickhouse
